<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanillia Scramjet</title>
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
</head>
<body>
<script>
(async () => {
    const target = "__VANILLIA_TARGET__";
    if (!target) return;
    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({ files: { wasm: "/scram/scramjet.wasm.wasm", all: "/scram/scramjet.all.js", sync: "/scram/scramjet.sync.js" } });
    scramjet.init();
    await navigator.serviceWorker.register("/sw.js");
    const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
    const wisp = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.host + "/wisp/";
    await connection.setTransport("/libcurl/index.mjs", [{ websocket: wisp }]);
    location.href = "/scram/service/" + encodeURIComponent(target);
})();
</script>
</body>
</html>
