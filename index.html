<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4efe3">
<title>Vanillia</title>
<style>
:root{--bg:#f1eadb;--chrome:#fffaf0;--chrome-2:#f8f1e4;--surface:#fffdf7;--surface-2:#eee5d4;--line:#d8ccb8;--line-2:#e5dccb;--text:#2d2923;--muted:#817666;--muted-2:#a19380;--hover:#eee6d7;--active:#e4d8c3;--shadow:0 14px 42px rgba(68,53,34,.14)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit;color:inherit}button{border:0}#app{height:100%;display:flex;flex-direction:column;background:var(--bg)}

.titlebar{height:43px;display:flex;align-items:flex-end;padding:0 9px;gap:8px}.tabs{height:36px;display:flex;align-items:flex-end;gap:4px;min-width:0;flex:1;overflow:hidden}.tab{height:35px;min-width:150px;max-width:230px;display:flex;align-items:center;gap:9px;padding:0 11px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;background:transparent;color:var(--muted);cursor:pointer;position:relative}.tab:hover{background:var(--hover);color:var(--text)}.tab.active{background:var(--surface);border-color:var(--line);color:var(--text)}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left;font-size:12px}.tab-close{width:20px;height:20px;border-radius:5px;background:transparent;display:grid;place-items:center;color:var(--muted-2);font-size:15px}.tab-close:hover{background:var(--hover);color:var(--text)}.tab-dot{width:10px;height:10px;border-radius:50%;background:#c9bba5;flex:0 0 auto}.new-tab{width:32px;height:32px;margin-bottom:2px;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:20px}.new-tab:hover{background:var(--hover);color:var(--text)}.window-space{width:70px;flex:0 0 70px}
.toolbar{height:51px;display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--chrome)}.nav-btn{width:33px;height:33px;display:grid;place-items:center;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}.nav-btn:hover{background:var(--hover);color:var(--text)}.nav-btn:disabled{opacity:.38;cursor:default;background:transparent}.nav-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.address-wrap{height:36px;display:flex;align-items:center;flex:1;min-width:100px;background:var(--chrome-2);border:1px solid var(--line);border-radius:9px;margin:0 4px;padding:0 5px;transition:.12s ease}.address-wrap:focus-within{border-color:#b9a88e;background:var(--surface)}.address-icon{width:29px;height:29px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}.address-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.address{height:100%;flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 7px;font-size:13px}.address::placeholder{color:var(--muted-2)}.address-action{width:29px;height:29px;display:grid;place-items:center;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.address-action:hover{background:var(--hover);color:var(--text)}.toolbar-right{display:flex;align-items:center;gap:2px}.bookmarks{height:31px;display:flex;align-items:center;gap:3px;padding:0 12px;background:var(--chrome-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line);overflow:auto;scrollbar-width:none}.bookmarks::-webkit-scrollbar{display:none}.bookmark{height:25px;padding:0 9px;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;white-space:nowrap;cursor:pointer}.bookmark:hover{background:var(--hover);color:var(--text)}
#workspace{position:relative;flex:1;min-height:0;overflow:hidden}.newtab{position:absolute;inset:0;display:flex;justify-content:center;overflow:auto;background:radial-gradient(circle at 50% 18%,rgba(255,253,247,.8),transparent 40%),var(--bg)}.newtab-inner{width:min(900px,calc(100% - 42px));padding:72px 0 80px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:29px}.brand-mark{width:42px;height:42px;border-radius:12px;background:#e4d8c3;border:1px solid #d2c4ac;display:grid;place-items:center;color:#5c503f;font-weight:750;font-size:17px}.brand-name{font-size:15px;font-weight:650}.brand-sub{font-size:11px;color:var(--muted-2);margin-top:2px}.hero{font-size:42px;line-height:1.04;letter-spacing:-2px;font-weight:650;margin:0 0 28px;max-width:650px}.search{height:54px;display:flex;align-items:center;background:rgba(255,253,247,.88);border:1px solid var(--line);border-radius:12px;box-shadow:0 7px 26px rgba(68,53,34,.08);padding:0 7px}.search:focus-within{border-color:#b8a88f;box-shadow:0 9px 30px rgba(68,53,34,.11)}.search svg{width:19px;height:19px;margin:0 7px;color:var(--muted);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.search input{height:100%;flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px}.search input::placeholder{color:#9f927f}.search-go{height:40px;padding:0 17px;border-radius:8px;background:var(--active);color:#514637;cursor:pointer;font-size:12px;font-weight:600}.search-go:hover{background:#daceb8}.quick-title{margin:27px 0 9px;font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted-2)}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick{min-height:72px;padding:12px;text-align:left;border:1px solid var(--line-2);border-radius:9px;background:rgba(255,250,240,.72);cursor:pointer}.quick:hover{background:var(--surface);border-color:var(--line)}.quick-name{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.quick-url{display:block;color:var(--muted-2);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-shell{position:absolute;inset:0;display:none;background:#fff}.page-shell.visible{display:block}.page-frame{width:100%;height:100%;border:0;background:white;display:block}.page-loading{position:absolute;left:0;top:0;height:2px;width:0;background:#a9997e;transition:width .18s ease;z-index:3}.status{position:absolute;left:14px;bottom:14px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:rgba(255,250,240,.96);color:var(--muted);font-size:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:.15s ease;pointer-events:none}.status.show{opacity:1;transform:none}
.engine{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(255,250,240,.96);box-shadow:var(--shadow);z-index:8}.engine button{height:27px;padding:0 9px;border-radius:6px;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.engine button:hover{background:var(--hover);color:var(--text)}.engine button.active{background:var(--active);color:var(--text);font-weight:650}
.panel{position:absolute;right:13px;top:9px;width:300px;max-height:calc(100% - 18px);overflow:auto;padding:15px;border:1px solid var(--line);border-radius:11px;background:rgba(255,250,240,.98);box-shadow:0 18px 50px rgba(68,53,34,.2);z-index:30;display:none}.panel.visible{display:block}.panel-title{font-size:13px;font-weight:700;margin-bottom:13px}.panel-section{padding:12px 0;border-top:1px solid var(--line-2)}.panel-section:first-of-type{border-top:0;padding-top:0}.panel-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted-2);margin-bottom:8px}.panel-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px;color:var(--muted)}.panel-row strong{color:var(--text);font-weight:600}.panel-btn{height:32px;padding:0 10px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;font-size:11px}.panel-btn:hover{background:var(--active)}.select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--chrome-2);outline:0;padding:0 7px;font-size:11px}.switch{width:32px;height:18px;border-radius:99px;background:#cfc3ae;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:14px;height:14px;top:2px;left:2px;border-radius:50%;background:#fffaf0;transition:.12s}.switch.on{background:#a9997e}.switch.on:after{transform:translateX(14px)}
.apps{position:absolute;right:8px;top:44px;width:290px;padding:13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,250,240,.98);box-shadow:var(--shadow);z-index:31;display:none}.apps.visible{display:block}.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.app{min-height:70px;padding:10px 7px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;text-align:center}.app:hover{background:var(--hover);border-color:var(--line)}.app-icon{width:30px;height:30px;margin:0 auto 7px;border-radius:8px;background:var(--active);display:grid;place-items:center;color:#5b4e3d}.app span{display:block;font-size:10px;color:var(--muted)}.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,10px);padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:rgba(255,250,240,.97);box-shadow:var(--shadow);color:var(--muted);font-size:10px;opacity:0;pointer-events:none;transition:.16s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.titlebar{padding-left:4px}.tab{min-width:125px}.window-space{display:none}.toolbar{padding:0 5px}.toolbar-right .hide-mobile{display:none}.bookmarks{display:none}.newtab-inner{padding-top:48px}.hero{font-size:32px}.quick-grid{grid-template-columns:repeat(2,1fr)}.engine{right:8px}.panel{right:8px;width:min(300px,calc(100% - 16px))}}
</style>
</head>
<body>
<div id="app">
<header class="browser-chrome">
<div class="titlebar"><div class="tabs" id="tabs"></div><button class="new-tab" id="new-tab" title="New tab" aria-label="New tab">+</button><div class="window-space"></div></div>
<div class="toolbar">
<button class="nav-btn" id="back" title="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="nav-btn" id="forward" title="Forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6 6"/></svg></button><button class="nav-btn" id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 0-13.7-5.7L4 8"/><path d="M4 4v4h4"/><path d="M4 12a8 8 0 0 0 13.7 5.7L20 16"/><path d="M20 20v-4h-4"/></svg></button><button class="nav-btn" id="home" title="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></button>
<div class="address-wrap"><div class="address-icon"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-3Z"/><path d="m9.5 12 1.7 1.7 3.6-3.8"/></svg></div><input class="address" id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter URL"><button class="address-action" id="bookmark" title="Bookmark">☆</button></div>
<div class="toolbar-right"><button class="nav-btn hide-mobile" id="history" title="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/><path d="M12 7v5l3 2"/></svg></button><button class="nav-btn" id="apps-button" title="Apps"><svg viewBox="0 0 24 24"><path d="M4 4h5v5H4zM15 4h5v5h-5zM4 15h5v5H4zM15 15h5v5h-5z"/></svg></button><button class="nav-btn" id="settings-button" title="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19 13.4a7.8 7.8 0 0 0 0-2.8l-2-1.3 2-3.4-2.3-1a8 8 0 0 0-2.4-1.4L14 3h-4l-.3 2.5A8 8 0 0 0 7.3 7L5 5.9l-2 3.4 2 1.3a7.8 7.8 0 0 0 0 2.8l-2 1.3 2 3.4 2.3-1a8 8 0 0 0 2.4 1.4l.3 2.5h4l.3-2.5a8 8 0 0 0 2.4-1.4l2.3 1 2-3.4-2-1.3Z"/></svg></button></div>
</div><div class="bookmarks" id="bookmarks"></div>
</header>
<main id="workspace">
<section class="newtab" id="newtab"><div class="newtab-inner"><div class="brand"><div class="brand-mark">V</div><div><div class="brand-name">Vanillia</div><div class="brand-sub">A quieter way to browse.</div></div></div><h1 class="hero">Browse without the noise.</h1><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="newtab-search" autocomplete="off" spellcheck="false" placeholder="Search the web, enter a URL, or type a query"><button class="search-go" id="search-go">Go</button></div><div class="quick-title">Quick access</div><div class="quick-grid"><button class="quick" data-url="https://google.com"><span class="quick-name">Google</span><span class="quick-url">google.com</span></button><button class="quick" data-url="https://wikipedia.org"><span class="quick-name">Wikipedia</span><span class="quick-url">wikipedia.org</span></button><button class="quick" data-url="https://github.com"><span class="quick-name">GitHub</span><span class="quick-url">github.com</span></button><button class="quick" data-url="https://youtube.com"><span class="quick-name">YouTube</span><span class="quick-url">youtube.com</span></button></div></div></section>
<section class="page-shell" id="page-shell"><div class="page-loading" id="page-loading"></div><iframe class="page-frame" id="page-frame" title="Vanillia browser page" referrerpolicy="no-referrer"></iframe></section>
<div class="engine" id="engine"><button class="active" data-engine="vanillia">Vanillia</button><button data-engine="uv">UV</button><button data-engine="scramjet">SJ</button></div>
<div class="panel" id="settings"><div class="panel-title">Vanillia settings</div><div class="panel-section"><div class="panel-label">Appearance</div><div class="panel-row"><span>Theme</span><strong>Vanilla Cream</strong></div><div class="panel-row"><span>Soft background</span><button class="switch on" id="soft-bg"></button></div></div><div class="panel-section"><div class="panel-label">Browsing</div><div class="panel-row"><span>Default engine</span><select class="select" id="engine-select"><option value="vanillia">VanilliaPXY</option><option value="uv">Ultraviolet</option><option value="scramjet">Scramjet</option></select></div><div class="panel-row"><span>Clear local history</span><button class="panel-btn" id="clear-history">Clear</button></div></div><div class="panel-section"><div class="panel-label">About</div><div class="panel-row"><span>Version</span><strong>1.0</strong></div><div class="panel-row"><span>Proxy</span><strong>VanilliaPXY</strong></div></div></div>
<div class="apps" id="apps"><div class="panel-title">Vanillia apps</div><div class="apps-grid"><button class="app" data-action="new"><div class="app-icon">+</div><span>New tab</span></button><button class="app" data-action="home"><div class="app-icon">⌂</div><span>Home</span></button><button class="app" data-action="history"><div class="app-icon">↶</div><span>History</span></button><button class="app" data-action="settings"><div class="app-icon">⚙</div><span>Settings</span></button><button class="app" data-action="gravity"><div class="app-icon">G</div><span>Gravity Lab</span></button><button class="app" data-action="voxels"><div class="app-icon">V</div><span>Voxel Worlds</span></button></div></div>
<div class="status" id="status"></div><div class="toast" id="toast"></div>
</main></div>
<script>
const state={tabs:[],active:0,engine:localStorage.getItem('vanillia-engine')||'vanillia',history:JSON.parse(localStorage.getItem('vanillia-history')||'[]'),bookmarks:JSON.parse(localStorage.getItem('vanillia-bookmarks')||'[]')};const $=id=>document.getElementById(id);const tabs=$('tabs'),newtab=$('newtab'),pageShell=$('page-shell'),pageFrame=$('page-frame'),address=$('address'),search=$('newtab-search'),status=$('status'),toast=$('toast'),loading=$('page-loading'),settings=$('settings'),apps=$('apps');
function normalize(v){v=v.trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;if(v.includes('.')&&!v.includes(' '))return 'https://'+v;return 'https://www.google.com/search?q='+encodeURIComponent(v)}function proxyUrl(url){return '/api/vanillia?url='+encodeURIComponent(url)}function save(){localStorage.setItem('vanillia-history',JSON.stringify(state.history.slice(-100)));localStorage.setItem('vanillia-bookmarks',JSON.stringify(state.bookmarks))}
function renderTabs(){tabs.innerHTML='';state.tabs.forEach((tab,i)=>{const el=document.createElement('div');el.className='tab'+(i===state.active?' active':'');el.innerHTML='<span class="tab-dot"></span><span class="tab-title"></span><button class="tab-close" title="Close">×</button>';el.querySelector('.tab-title').textContent=tab.title||'New Tab';el.addEventListener('click',e=>{if(e.target.closest('.tab-close'))return;state.active=i;showTab()});el.querySelector('.tab-close').addEventListener('click',e=>{e.stopPropagation();closeTab(i)});tabs.appendChild(el)})}function addTab(url=''){state.tabs.push({title:'New Tab',url});state.active=state.tabs.length-1;renderTabs();showTab()}function closeTab(i){if(state.tabs.length===1){state.tabs[0]={title:'New Tab',url:''};state.active=0;showTab();return}state.tabs.splice(i,1);if(state.active>=state.tabs.length)state.active=state.tabs.length-1;renderTabs();showTab()}
function showTab(){const tab=state.tabs[state.active]||state.tabs[0];if(!tab){addTab();return}renderTabs();if(tab.url){newtab.style.display='none';pageShell.classList.add('visible');address.value=tab.url;loadFrame(tab.url,false)}else{newtab.style.display='flex';pageShell.classList.remove('visible');address.value='';pageFrame.src='about:blank'}}function loadFrame(url,record=true){url=normalize(url);if(!url)return;if(record){const tab=state.tabs[state.active];tab.url=url;tab.title=new URL(url).hostname.replace(/^www\./,'')||'Page';state.history.push({url,title:tab.title,time:Date.now()});save();renderTabs()}newtab.style.display='none';pageShell.classList.add('visible');address.value=url;statusText('Loading '+new URL(url).hostname+'…');loading.style.width='20%';setTimeout(()=>loading.style.width='68%',120);pageFrame.onload=()=>{loading.style.width='100%';setTimeout(()=>loading.style.width='0',180);statusText('Loaded');setTimeout(()=>status.classList.remove('show'),900)};pageFrame.onerror=()=>{loading.style.width='0';statusText('The page could not be loaded')};pageFrame.src=proxyUrl(url)}function navigate(v){const url=normalize(v);if(url)loadFrame(url,true)}function statusText(t){status.textContent=t;status.classList.add('show')}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1400)}function togglePanel(panel){const other=panel===settings?apps:settings;other.classList.remove('visible');panel.classList.toggle('visible')}
function renderBookmarks(){const bar=$('bookmarks');bar.innerHTML='';const items=state.bookmarks.length?state.bookmarks:[{title:'GitHub',url:'https://github.com'},{title:'Wikipedia',url:'https://wikipedia.org'},{title:'YouTube',url:'https://youtube.com'}];items.forEach(item=>{const b=document.createElement('button');b.className='bookmark';b.textContent=item.title;b.onclick=()=>navigate(item.url);bar.appendChild(b)})}
$('new-tab').onclick=()=>addTab();$('home').onclick=()=>{const tab=state.tabs[state.active];tab.url='';tab.title='New Tab';showTab()};$('back').onclick=()=>{try{pageFrame.contentWindow.history.back()}catch{}};$('forward').onclick=()=>{try{pageFrame.contentWindow.history.forward()}catch{}};$('reload').onclick=()=>{if(state.tabs[state.active]?.url)loadFrame(state.tabs[state.active].url,false)};$('bookmark').onclick=()=>{const tab=state.tabs[state.active];if(!tab?.url)return showToast('Nothing to bookmark');const title=tab.title||new URL(tab.url).hostname;state.bookmarks.push({title,url:tab.url});save();renderBookmarks();showToast('Bookmarked '+title)};
$('settings-button').onclick=()=>togglePanel(settings);$('apps-button').onclick=()=>togglePanel(apps);$('history').onclick=()=>showToast(state.history.length+' history entries');document.addEventListener('click',e=>{if(!e.target.closest('#settings')&&!e.target.closest('#settings-button'))settings.classList.remove('visible');if(!e.target.closest('#apps')&&!e.target.closest('#apps-button'))apps.classList.remove('visible')});address.addEventListener('keydown',e=>{if(e.key==='Enter'){navigate(address.value);address.blur()}});search.addEventListener('keydown',e=>{if(e.key==='Enter')navigate(search.value)});$('search-go').onclick=()=>navigate(search.value);document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>navigate(b.dataset.url));
document.querySelectorAll('.engine button').forEach(b=>b.onclick=()=>{state.engine=b.dataset.engine;localStorage.setItem('vanillia-engine',state.engine);document.querySelectorAll('.engine button').forEach(x=>x.classList.toggle('active',x===b));$('engine-select').value=state.engine;showToast('Engine: '+b.textContent)});$('engine-select').value=state.engine;$('engine-select').onchange=e=>{state.engine=e.target.value;localStorage.setItem('vanillia-engine',state.engine);document.querySelectorAll('.engine button').forEach(x=>x.classList.toggle('active',x.dataset.engine===state.engine))};$('soft-bg').onclick=()=>{$('soft-bg').classList.toggle('on');document.body.style.setProperty('--bg',$('soft-bg').classList.contains('on')?'#f1eadb':'#eee8dc')};$('clear-history').onclick=()=>{state.history=[];save();showToast('History cleared')};
document.querySelectorAll('.app').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='new')addTab();if(a==='home')$('home').click();if(a==='settings')togglePanel(settings);if(a==='history')showToast(state.history.length+' history entries');if(a==='gravity')navigate('https://gravitylab.portal-network.com');if(a==='voxels')navigate('https://portal-network.com/voxels/')});window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();address.focus();address.select()}if((e.ctrlKey||e.metaKey)&&e.key==='t'){e.preventDefault();addTab()}if((e.ctrlKey||e.metaKey)&&e.key==='w'){e.preventDefault();closeTab(state.active)}});state.tabs=[{title:'New Tab',url:''}];renderBookmarks();renderTabs();showTab();
</script>
</body></html>
