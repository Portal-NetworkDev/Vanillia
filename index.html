<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanillia</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #f4efe3; color: #29251f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
body { overflow: hidden; }
button, input { font: inherit; }
button { color: inherit; }
#app { width: 100%; height: 100%; display: flex; flex-direction: column; background: #f4efe3; }
#topbar { height: 58px; flex: 0 0 58px; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #fffaf0; border-bottom: 1px solid #ddd3c1; }
#nav { display: flex; align-items: center; gap: 5px; }
.nav-button { height: 32px; padding: 0 11px; border: 0; border-radius: 6px; background: transparent; color: #817766; cursor: pointer; font-size: 13px; }
.nav-button:hover { background: #eee6d6; color: #40382d; }
.nav-button.active { background: #e7ddc9; color: #29251f; }
#address-wrap { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
#address { width: 100%; height: 36px; border: 1px solid #d7cbb7; border-radius: 7px; outline: none; background: #f8f3e9; color: #40382d; padding: 0 13px; font-size: 13px; transition: border-color .12s ease; }
#address:focus { border-color: #a9987c; }
#address::placeholder { color: #a69a88; }
.icon-button { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 7px; background: transparent; color: #817766; cursor: pointer; }
.icon-button:hover { background: #eee6d6; border-color: #d8cdbb; color: #40382d; }
.icon-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#content { position: relative; flex: 1; min-height: 0; }
#home { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
#home-inner { width: min(720px, calc(100% - 36px)); padding: 60px 0 100px; }
.home-title { margin: 0 0 27px; font-size: 34px; font-weight: 650; letter-spacing: -1.5px; color: #29251f; }
#search-box { display: flex; height: 48px; background: #fffaf0; border: 1px solid #d7cbb7; border-radius: 9px; overflow: hidden; }
#home-input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #40382d; padding: 0 15px; font-size: 14px; }
#home-input::placeholder { color: #a69a88; }
#go { width: 66px; border: 0; border-left: 1px solid #d7cbb7; background: #eee6d6; color: #5a4e3e; cursor: pointer; }
#go:hover { background: #e6dcc9; color: #29251f; }
#quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.quick-button { min-height: 68px; padding: 12px; text-align: left; border: 1px solid #ddd3c1; border-radius: 8px; background: #fffaf0; cursor: pointer; }
.quick-button:hover { background: #f0e8d8; border-color: #cfc2ac; }
.quick-name { display: block; font-size: 13px; color: #514638; margin-bottom: 4px; }
.quick-url { display: block; font-size: 11px; color: #9b8e7b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#browser { position: absolute; inset: 0; display: none; flex-direction: column; background: #eee8dc; }
#browser.visible { display: flex; }
#browserbar { display: none; height: 0; flex: 0 0 0; align-items: center; gap: 5px; padding: 0 8px; background: #fffaf0; border-bottom: 1px solid #ddd3c1; }
#page-url { flex: 1; min-width: 0; height: 29px; border: 1px solid #d7cbb7; border-radius: 6px; background: #f8f3e9; color: #817766; padding: 0 10px; font-size: 12px; outline: 0; }
#page { width: 100%; height: 100%; flex: 1; overflow: auto; background: white; position: relative; }
#page img, #page video, #page canvas { max-width: 100%; }
#status { position: absolute; left: 12px; bottom: 12px; padding: 6px 9px; border: 1px solid #d7cbb7; border-radius: 6px; background: rgba(255,250,240,.94); color: #817766; font-size: 10px; pointer-events: none; opacity: 0; transition: opacity .15s ease; }
#status.show { opacity: 1; }
#settings { position: absolute; top: 50px; right: 12px; width: 280px; display: none; padding: 15px; border: 1px solid #d7cbb7; border-radius: 9px; background: #fffaf0; box-shadow: 0 12px 35px rgba(72,57,36,.18); z-index: 20; }
#settings.visible { display: block; }
.settings-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: #40382d; }
.setting { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid #e5dccd; font-size: 12px; color: #817766; }
.setting:first-of-type { border-top: 0; }
select { border: 1px solid #d7cbb7; border-radius: 6px; background: #f8f3e9; color: #5a4e3e; padding: 5px 7px; outline: none; }
.toggle { width: 32px; height: 18px; border-radius: 20px; border: 0; background: #cfc4b1; position: relative; cursor: pointer; }
.toggle::after { content: ""; position: absolute; width: 14px; height: 14px; top: 2px; left: 2px; border-radius: 50%; background: #8e816e; transition: transform .12s ease; }
.toggle.on { background: #a9997e; }
.toggle.on::after { transform: translateX(14px); background: #fffaf0; }
@media (max-width: 650px) {
	#topbar { gap: 8px; padding: 0 9px; }
	#nav { display: none; }
	.home-title { font-size: 29px; }
	#quick { grid-template-columns: 1fr; }
	#home-inner { padding-top: 35px; }
}
</style>
<style id="settings-upgrade-style">.settings-section { margin: 13px 0 3px; padding-top: 10px; border-top: 1px solid #e5dccd; font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: #9b8e7b; }.settings-section:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }body.dark-mode, body.dark-mode #app { background: #24211d; color: #eee8dc; }body.dark-mode #topbar { background: #2c2924; border-color: #464037; }body.dark-mode .nav-button, body.dark-mode .icon-button { color: #bdb3a3; }body.dark-mode .nav-button:hover, body.dark-mode .icon-button:hover { background: #3a352e; color: #fffaf0; border-color: #51493e; }body.dark-mode .nav-button.active { background: #40392f; color: #fffaf0; }body.dark-mode #address, body.dark-mode #search-box, body.dark-mode .quick-button, body.dark-mode #settings, body.dark-mode #page-url { background: #302c26; border-color: #4a4339; color: #eee8dc; }body.dark-mode #address::placeholder, body.dark-mode #home-input::placeholder { color: #8f8679; }body.dark-mode #home-input { color: #eee8dc; }body.dark-mode .home-title { color: #f4efe3; }body.dark-mode .quick-name { color: #ddd4c6; }body.dark-mode .quick-url, body.dark-mode .setting, body.dark-mode .settings-section { color: #9f9587; }body.dark-mode .setting { border-color: #464037; }body.dark-mode select { background: #302c26; border-color: #4a4339; color: #ddd4c6; }body.animated-bg #home::before { content: ""; position: absolute; inset: -25%; background: radial-gradient(circle at 20% 30%, rgba(169,153,126,.14), transparent 32%), radial-gradient(circle at 80% 70%, rgba(169,153,126,.10), transparent 30%); animation: vanillia-drift 18s ease-in-out infinite alternate; pointer-events: none; }body.animated-bg #home-inner { position: relative; z-index: 1; }@keyframes vanillia-drift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 1%, 0) scale(1.06); } }@media (prefers-reduced-motion: reduce) { body.animated-bg #home::before { animation: none; } }</style>
</head>

<script>
(() => {
    const host = document.getElementById("page");
    if (!host || host.shadowRoot) return;
    const shadow = host.attachShadow({ mode: "open" });
    host.replaceChildren = (...nodes) => shadow.replaceChildren(...nodes);
    host.appendChild = node => shadow.appendChild(node);
    host.append = (...nodes) => shadow.append(...nodes);
    host.querySelectorAll = (...args) => shadow.querySelectorAll(...args);
    host.querySelector = (...args) => shadow.querySelector(...args);
})();
</script>
<script>
const BACKENDS = {
	vanillia: { name: "VanilliaPXY", base: "/", route: "vanillia?url=" },
	scramjet: { name: "Scramjet", route: "education?portal=" },
	ultraviolet: { name: "Ultraviolet", route: "classroom?class=" },
	rammerhead: { name: "Rammerhead", route: "teach?learn=" }
};

const home = document.getElementById("home");
const browser = document.getElementById("browser");
const address = document.getElementById("address");
const homeInput = document.getElementById("home-input");
const pageUrl = document.getElementById("page-url");
const page = document.getElementById("page");
const status = document.getElementById("status");
const settings = document.getElementById("settings");
const backendSelect = document.getElementById("backend");

let currentUrl = "";
let historyStack = [];
let historyIndex = -1;
let openNewTab = false;
let useHttps = true;
let selectedBackend = localStorage.getItem("vanillia-backend") || "vanillia";

if (!BACKENDS[selectedBackend]) selectedBackend = "vanillia";
backendSelect.value = selectedBackend;

window.addEventListener("beforeunload", event => {
	event.preventDefault();
	event.returnValue = "";
});

function normalizeUrl(value) {
	value = value.trim();
	if (!value) return "";
	if (/^https?:\/\//i.test(value)) return value;
	if (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(value)) return (useHttps ? "https://" : "http://") + value;
	return "https://www.google.com/search?q=" + encodeURIComponent(value);
}

function proxyUrl(url) {
	const backend = BACKENDS[selectedBackend];
	const base = backend.base || (useHttps ? window.location.protocol : "http:") + "//" + window.location.host + "/";
	return base + backend.route + encodeURIComponent(url);
}

function showStatus(text) {
	status.textContent = text;
	status.classList.add("show");
	clearTimeout(showStatus.timer);
	showStatus.timer = setTimeout(() => status.classList.remove("show"), 1800);
}

function runScript(script) {
	return new Promise((resolve, reject) => {
		const node = document.createElement("script");
		for (const attribute of script.attributes) node.setAttribute(attribute.name, attribute.value);
		node.textContent = script.textContent;
		node.onload = resolve;
		node.onerror = reject;
		page.appendChild(node);
		if (!node.src) resolve();
	});
}

async function renderPage(html, baseUrl) {
	const parsed = new DOMParser().parseFromString(html, "text/html");
	page.replaceChildren();
	page.dataset.url = baseUrl;

	const headNodes = Array.from(parsed.head.children).filter(node => {
		return !["TITLE", "BASE", "SCRIPT"].includes(node.tagName);
	});
	for (const node of headNodes) page.appendChild(document.importNode(node, true));

	const bodyNodes = Array.from(parsed.body.childNodes);
	const scripts = [];
	for (const node of bodyNodes) {
		if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "SCRIPT") {
			scripts.push(node);
			continue;
		}
		page.appendChild(document.importNode(node, true));
	}

	for (const script of scripts) {
		try {
			await runScript(script);
		} catch {}
	}

	page.querySelectorAll("a[href]").forEach(link => {
		link.addEventListener("click", event => {
			if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
			const href = link.href;
			if (!href || href.startsWith("javascript:")) return;
			event.preventDefault();
			navigate(href);
		});
	});

	page.querySelectorAll("form").forEach(form => {
		form.addEventListener("submit", event => {
			if (event.defaultPrevented) return;
			event.preventDefault();
			const method = (form.method || "get").toLowerCase();
			if (method !== "get") return;
			const action = form.action || baseUrl;
			const params = new URLSearchParams(new FormData(form));
			const target = params.toString() ? action + (action.includes("?") ? "&" : "?") + params : action;
			navigate(target);
		});
	});
}

async function loadPage(url) {
	showStatus("Loading...");
	const response = await fetch(proxyUrl(url), { credentials: "include" });
	if (!response.ok) throw new Error("HTTP " + response.status);
	const html = await response.text();
	await renderPage(html, url);
	status.classList.remove("show");
}

async function navigate(value, addHistory = true) {
	const target = normalizeUrl(value);
	if (!target) return;
	currentUrl = target;
	address.value = target;
	pageUrl.value = target;
	home.style.display = "none";
	browser.classList.add("visible");
	document.querySelectorAll(".nav-button").forEach(button => button.classList.remove("active"));
	if (addHistory) {
		historyStack = historyStack.slice(0, historyIndex + 1);
		historyStack.push(target);
		historyIndex++;
	}
	const targetUrl = proxyUrl(target);
	if (openNewTab) {
		window.open(targetUrl, "_blank");
		return;
	}
	try {
		await loadPage(target);
	} catch (error) {
		showStatus("Failed to load page");
		page.innerHTML = "<div style=\"padding:24px;font:14px system-ui;color:#514638\">Unable to load this page.</div>";
	}
}

function goHome() {
	browser.classList.remove("visible");
	home.style.display = "flex";
	address.value = "";
	homeInput.focus();
	document.querySelectorAll(".nav-button").forEach(button => button.classList.remove("active"));
	document.getElementById("home-nav").classList.add("active");
}

function goBack() {
	if (historyIndex <= 0) return;
	historyIndex--;
	navigate(historyStack[historyIndex], false);
}

function goForward() {
	if (historyIndex >= historyStack.length - 1) return;
	historyIndex++;
	navigate(historyStack[historyIndex], false);
}

function reload() {
	if (!currentUrl) return;
	loadPage(currentUrl).catch(() => showStatus("Failed to reload page"));
}

function submitHome() {
	navigate(homeInput.value);
	homeInput.value = "";
}

address.addEventListener("keydown", event => {
	if (event.key === "Enter") navigate(address.value);
});

homeInput.addEventListener("keydown", event => {
	if (event.key === "Enter") submitHome();
});

pageUrl.addEventListener("keydown", event => {
	if (event.key === "Enter") navigate(pageUrl.value);
});

document.getElementById("go").addEventListener("click", submitHome);
document.getElementById("home-nav").addEventListener("click", goHome);
document.getElementById("new-tab").addEventListener("click", goHome);
document.getElementById("back").addEventListener("click", goBack);
document.getElementById("browser-back").addEventListener("click", goBack);
document.getElementById("forward").addEventListener("click", goForward);
document.getElementById("browser-forward").addEventListener("click", goForward);
document.getElementById("reload").addEventListener("click", reload);
document.getElementById("browser-reload").addEventListener("click", reload);

document.getElementById("settings-button").addEventListener("click", event => {
	event.stopPropagation();
	settings.classList.toggle("visible");
});

document.addEventListener("click", event => {
	if (!settings.contains(event.target) && event.target.id !== "settings-button") settings.classList.remove("visible");
});

document.getElementById("backend").addEventListener("change", event => {
	selectedBackend = event.target.value;
	localStorage.setItem("vanillia-backend", selectedBackend);
	showStatus(BACKENDS[selectedBackend].name + " selected");
	if (currentUrl && browser.classList.contains("visible")) {
		showStatus("Switching backend...");
		loadPage(currentUrl).catch(() => showStatus("Failed to switch backend"));
	}
});

document.getElementById("https-toggle").addEventListener("click", event => {
	useHttps = event.currentTarget.classList.toggle("on");
});

document.getElementById("tab-toggle").addEventListener("click", event => {
	openNewTab = event.currentTarget.classList.toggle("on");
});

document.querySelectorAll(".quick-button").forEach(button => {
	button.addEventListener("click", () => navigate(button.dataset.url));
});

window.addEventListener("keydown", event => {
	if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "l") {
		event.preventDefault();
		address.focus();
		address.select();
	}
	if ((event.altKey || event.metaKey) && event.key === "ArrowLeft") {
		event.preventDefault();
		goBack();
	}
	if ((event.altKey || event.metaKey) && event.key === "ArrowRight") {
		event.preventDefault();
		goForward();
	}
});
</script>
<script id="settings-upgrade-script">
(() => {
    const keys = { dark: "vanillia-dark-mode", animation: "vanillia-animated-bg", forceDark: "vanillia-force-dark", motion: "vanillia-reduced-motion", adblock: "vanillia-adblock", games: "vanillia-games", movies: "vanillia-movies", gibby: "vanillia-gibby" };
    const defaults = { dark: false, animation: false, forceDark: false, motion: false, adblock: true, games: false, movies: false, gibby: false };
    const read = key => localStorage.getItem(keys[key]) === null ? defaults[key] : localStorage.getItem(keys[key]) === "true";
    const set = (key, value) => localStorage.setItem(keys[key], String(value));
    const buttons = { dark: document.getElementById("dark-toggle"), animation: document.getElementById("animation-toggle"), forceDark: document.getElementById("force-dark-toggle"), motion: document.getElementById("motion-toggle"), adblock: document.getElementById("adblock-toggle"), games: document.getElementById("games-toggle"), movies: document.getElementById("movies-toggle"), gibby: document.getElementById("gibby-toggle") };
    const applyPageDark = () => {
        if (!page || !page.shadowRoot) return;
        let style = page.shadowRoot.getElementById("vanillia-force-dark");
        if (!read("forceDark")) { if (style) style.remove(); return; }
        if (!style) { style = document.createElement("style"); style.id = "vanillia-force-dark"; page.shadowRoot.appendChild(style); }
        style.textContent = 'html, body { background: #181715 !important; color: #eee8dc !important; } body, main, header, footer, section, article, nav, aside, div, p, li, td, th, pre, code, input, textarea, select, button { background-color: #24211d !important; color: #eee8dc !important; border-color: #4a4339 !important; } a { color: #d8cdbb !important; } img, video, canvas { filter: brightness(.86) !important; }';
    };
    const apply = () => {
        document.body.classList.toggle("dark-mode", read("dark"));
        document.body.classList.toggle("animated-bg", read("animation") && !read("motion"));
        Object.entries(buttons).forEach(([key, button]) => button && button.classList.toggle("on", read(key)));
        applyPageDark();
    };
    Object.entries(buttons).forEach(([key, button]) => {
        if (!button) return;
        button.addEventListener("click", () => { set(key, !read(key)); apply(); });
    });
    const observer = new MutationObserver(applyPageDark);
    if (page) observer.observe(page, { childList: true, subtree: true });
    apply();
})();
</script>
</body>
