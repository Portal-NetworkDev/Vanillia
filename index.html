const state={tabs:[],active:0,engine:sessionStorage.getItem('vanillia-engine')||localStorage.getItem('vanillia-engine')||'vanillia',history:JSON.parse(localStorage.getItem('vanillia-history')||'[]'),bookmarks:JSON.parse(localStorage.getItem('vanillia-bookmarks')||'[]'),developerMode:localStorage.getItem('vanillia-developer-mode')==='true'};const $=id=>document.getElementById(id),tabs=$('tabs'),newtab=$('newtab'),pageShell=$('page-shell'),pageRoot=$('page-root'),address=$('address'),search=$('newtab-search'),status=$('status'),toast=$('toast'),loading=$('page-loading'),settings=$('settings'),apps=$('apps'),devtools=$('devtools'),devtoolsOutput=$('devtools-output'),devtoolsCount=$('devtools-count');const nativeConsole={log:console.log.bind(console),info:console.info.bind(console),warn:console.warn.bind(console),error:console.error.bind(console),debug:console.debug.bind(console)};let devCount=0;
function serialize(v){if(typeof v==='string')return v;if(v instanceof Error)return v.stack||v.message;try{return JSON.stringify(v,null,2)}catch{return String(v)}}function devWrite(level,args,stack=''){if(!state.developerMode)return;const empty=devtoolsOutput.querySelector('.dev-empty');if(empty)empty.remove();const line=document.createElement('div');line.className='dev-line '+level;line.innerHTML='<span class="dev-time"></span><span class="dev-level"></span><span class="dev-message"></span>';line.children[0].textContent=new Date().toLocaleTimeString();line.children[1].textContent=level;line.children[2].textContent=args.map(serialize).join(' ')+(stack?'\n'+stack:'');devtoolsOutput.appendChild(line);devtoolsOutput.scrollTop=devtoolsOutput.scrollHeight;devCount++;devtoolsCount.textContent=devCount+' message'+(devCount===1?'':'s')}for(const level of Object.keys(nativeConsole))console[level]=(...args)=>{nativeConsole[level](...args);devWrite(level,args)};window.addEventListener('error',e=>devWrite('error',[e.message||'Unknown error'],e.error?.stack||`${e.filename||'unknown'}:${e.lineno||0}:${e.colno||0}`));window.addEventListener('unhandledrejection',e=>devWrite('error',['Unhandled promise rejection:',e.reason],e.reason?.stack||''));
function normalize(v){v=v.trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;if(v.includes('.')&&!v.includes(' '))return 'https://'+v;return 'https://www.google.com/search?q='+encodeURIComponent(v)}function save(){localStorage.setItem('vanillia-history',JSON.stringify(state.history.slice(-100)));localStorage.setItem('vanillia-bookmarks',JSON.stringify(state.bookmarks))}function statusText(t){status.textContent=t;status.classList.add('show')}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1400)}function proxyUrl(url){return '/api/vanillia?url='+encodeURIComponent(url)}function renderTabs(){tabs.innerHTML='';state.tabs.forEach((tab,i)=>{const el=document.createElement('div');el.className='tab'+(i===state.active?' active':'');el.innerHTML='<span class="tab-dot"></span><span class="tab-title"></span><button class="tab-close">×</button>';el.querySelector('.tab-title').textContent=tab.title||'New Tab';el.onclick=e=>{if(e.target.closest('.tab-close'))return;state.active=i;showTab()};el.querySelector('.tab-close').onclick=e=>{e.stopPropagation();closeTab(i)};tabs.appendChild(el)})}function addTab(url=''){state.tabs.push({title:'New Tab',url});state.active=state.tabs.length-1;renderTabs();showTab()}function closeTab(i){if(state.tabs.length===1){state.tabs[0]={title:'New Tab',url:''};showTab();return}state.tabs.splice(i,1);if(state.active>=state.tabs.length)state.active=state.tabs.length-1;renderTabs();showTab()}function showTab(){const tab=state.tabs[state.active]||state.tabs[0];if(!tab){addTab();return}renderTabs();if(tab.url){newtab.style.display='none';pageShell.classList.add('visible');address.value=tab.url;loadPage(tab.url,false)}else{newtab.style.display='flex';pageShell.classList.remove('visible');address.value='';pageRoot.replaceChildren()}}
function setActiveEngine(engine){state.engine=engine;sessionStorage.setItem('vanillia-engine',engine);localStorage.setItem('vanillia-engine',engine);document.querySelectorAll('.engine button').forEach(b=>b.classList.toggle('active',b.dataset.engine===engine));$('engine-select').value=engine;devWrite('info',['Engine selected:',engine])}function importScript(src){return new Promise((resolve,reject)=>{if(document.querySelector(`script[src="${src}"]`))return resolve();const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Failed to load '+src));document.head.appendChild(s)})}
async function prepareProxyEngine(engine){if(engine==='vanillia')return true;if(!('serviceWorker'in navigator))throw new Error('Service workers are unavailable');await importScript('/baremux/index.js');if(engine==='uv'){await importScript('/uv/uv.bundle.js');await importScript('/uv/uv.config.js');await navigator.serviceWorker.register('/uv/sw.js',{scope:'/'});if(!navigator.serviceWorker.controller){sessionStorage.setItem('vanillia-sw-reload','1');location.reload();return false}const connection=new BareMux.BareMuxConnection('/baremux/worker.js');const wisp=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/wisp/';await connection.setTransport('/epoxy/index.mjs',[{wisp}]);return true}await navigator.serviceWorker.register('/sw.js',{scope:'/'});if(!navigator.serviceWorker.controller){sessionStorage.setItem('vanillia-sw-reload','1');location.reload();return false}const connection=new BareMux.BareMuxConnection('/baremux/worker.js');const wisp=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/wisp/';await connection.setTransport('/libcurl/index.mjs',[{websocket:wisp}]);return true}function engineTarget(engine,url){if(engine==='uv'){if(!window.Ultraviolet)throw new Error('Ultraviolet client is not loaded');return '/service/'+Ultraviolet.codec.xor.encode(url)}if(engine==='scramjet')return '/scram/service/'+encodeURIComponent(url);return proxyUrl(url)}
async function loadPage(rawUrl,record=true){const url=normalize(rawUrl);if(!url)return;const tab=state.tabs[state.active];if(record){tab.url=url;tab.title=new URL(url).hostname.replace(/^www\./,'')||'Page';state.history.push({url,title:tab.title,time:Date.now()});save();renderTabs()}newtab.style.display='none';pageShell.classList.add('visible');address.value=url;pageRoot.replaceChildren();statusText('Loading '+state.engine+'…');loading.style.width='22%';try{if(state.engine==='vanillia')await loadVanillia(url);else await loadProxyEnginePage(url,state.engine);loading.style.width='100%';setTimeout(()=>loading.style.width='0',180);statusText('Loaded');setTimeout(()=>status.classList.remove('show'),900)}catch(e){loading.style.width='0';statusText(state.engine+' failed');showToast(e.message||'Proxy error');devWrite('error',[state.engine+' navigation failed:',e],e.stack||'')}}
async function loadVanillia(url){const response=await fetch(proxyUrl(url));if(!response.ok)throw new Error('VanilliaPXY returned '+response.status);const type=response.headers.get('content-type')||'';if(type.includes('text/html')||type.includes('application/xhtml+xml')){const html=await response.text();const doc=new DOMParser().parseFromString(html,'text/html');rewriteDocument(doc,url);pageRoot.replaceChildren(...Array.from(doc.body.childNodes));for(const style of doc.querySelectorAll('style'))pageRoot.prepend(style.cloneNode(true));for(const link of doc.querySelectorAll('link[rel="stylesheet"]')){try{const css=await fetch(proxyUrl(new URL(link.getAttribute('href'),url).href)).then(r=>r.text());const s=document.createElement('style');s.textContent=css;pageRoot.prepend(s)}catch(e){devWrite('warn',['Stylesheet failed:',e])}}for(const script of doc.querySelectorAll('script')){const type=(script.getAttribute('type')||'').toLowerCase();if(type&&!['text/javascript','application/javascript','application/ecmascript','text/ecmascript','module'].includes(type))continue;const s=document.createElement('script');if(script.src)s.src=proxyUrl(new URL(script.getAttribute('src'),url).href);else s.textContent=script.textContent;s.async=false;pageRoot.appendChild(s)}}else{const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);let el;if(type.startsWith('image/')){el=document.createElement('img');el.src=objectUrl}else if(type.startsWith('video/')){el=document.createElement('video');el.src=objectUrl;el.controls=true}else if(type.startsWith('audio/')){el=document.createElement('audio');el.src=objectUrl;el.controls=true}else{el=document.createElement('pre');el.textContent=await blob.text()}pageRoot.appendChild(el)}}
async function loadProxyEnginePage(url,engine){const ready=await prepareProxyEngine(engine);if(ready===false)return;const target=engineTarget(engine,url);devWrite('info',['Proxy target:',target]);const response=await fetch(target);if(!response.ok)throw new Error(engine+' returned '+response.status);const type=response.headers.get('content-type')||'';if(!type.includes('text/html')){const blob=await response.blob();const objectUrl=URL.createObjectURL(blob);const node=document.createElement(type.startsWith('image/')?'img':type.startsWith('video/')?'video':type.startsWith('audio/')?'audio':'pre');if(node.tagName==='PRE')node.textContent=await blob.text();else node.src=objectUrl;if('controls'in node)node.controls=true;pageRoot.appendChild(node);return}const html=await response.text();const doc=new DOMParser().parseFromString(html,'text/html');pageRoot.replaceChildren(...Array.from(doc.body.childNodes));for(const style of doc.querySelectorAll('style'))pageRoot.prepend(style.cloneNode(true));for(const script of doc.querySelectorAll('script')){const type=(script.getAttribute('type')||'').toLowerCase();if(type&&!['text/javascript','application/javascript','application/ecmascript','text/ecmascript','module'].includes(type))continue;const s=document.createElement('script');if(script.src)s.src=script.src;else s.textContent=script.textContent;s.async=false;pageRoot.appendChild(s)}}
function rewriteDocument(doc,baseUrl){doc.querySelectorAll('[href],[src],[action]').forEach(el=>{for(const attr of ['href','src','action']){const value=el.getAttribute(attr);if(!value||value.startsWith('#')||/^(data|javascript|mailto|tel):/i.test(value))continue;try{el.setAttribute(attr,proxyUrl(new URL(value,baseUrl).href))}catch{}}});doc.querySelectorAll('a[href]').forEach(a=>a.addEventListener('click',e=>{const href=a.getAttribute('href');if(href&&!href.startsWith('#')){e.preventDefault();loadPage(new URL(href,baseUrl).href,true)}}));doc.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();const target=new URL(f.action||baseUrl,baseUrl);const data=new FormData(f);if((f.method||'get').toLowerCase()==='get')for(const [k,v] of data)target.searchParams.set(k,v);loadPage(target.href,true)}))}async function switchEngine(engine){setActiveEngine(engine);const url=state.tabs[state.active]?.url;if(url)await loadPage(url,false);else showToast('Engine: '+engine)}function renderBookmarks(){const bar=$('bookmarks');bar.innerHTML='';const items=state.bookmarks.length?state.bookmarks:[{title:'GitHub',url:'https://github.com'},{title:'Wikipedia',url:'https://wikipedia.org'},{title:'YouTube',url:'https://youtube.com'}];items.forEach(item=>{const b=document.createElement('button');b.className='bookmark';b.textContent=item.title;b.onclick=()=>navigate(item.url);bar.appendChild(b)})}function navigate(v){const url=normalize(v);if(url)loadPage(url,true)}
$('new-tab').onclick=()=>addTab();$('home').onclick=()=>{state.tabs[state.active]={title:'New Tab',url:''};showTab()};$('reload').onclick=()=>{const u=state.tabs[state.active]?.url;if(u)loadPage(u,false)};$('back').onclick=()=>history.back();$('forward').onclick=()=>history.forward();$('bookmark').onclick=()=>{const t=state.tabs[state.active];if(!t?.url)return;state.bookmarks.push({title:t.title,url:t.url});save();renderBookmarks();showToast('Bookmarked '+t.title)};$('settings-button').onclick=()=>{apps.classList.remove('visible');settings.classList.toggle('visible')};$('apps-button').onclick=()=>{settings.classList.remove('visible');apps.classList.toggle('visible')};address.onkeydown=e=>{if(e.key==='Enter'){navigate(address.value);address.blur()}};search.onkeydown=e=>{if(e.key==='Enter')navigate(search.value)};$('search-go').onclick=()=>navigate(search.value);document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>navigate(b.dataset.url));document.querySelectorAll('.engine button').forEach(b=>b.onclick=()=>switchEngine(b.dataset.engine));$('engine-select').onchange=e=>switchEngine(e.target.value);$('clear-history').onclick=()=>{state.history=[];save();showToast('History cleared')};$('developer-mode').onclick=()=>{state.developerMode=!state.developerMode;localStorage.setItem('vanillia-developer-mode',state.developerMode);$('developer-mode').classList.toggle('on',state.developerMode);devtools.classList.toggle('visible',state.developerMode);$('workspace').classList.toggle('devtools-open',state.developerMode)};$('devtools-clear').onclick=()=>{devtoolsOutput.innerHTML='<div class="dev-empty">Console cleared.</div>';devCount=0;devtoolsCount.textContent='0 messages'};document.querySelectorAll('.app').forEach(b=>b.onclick=()=>{if(b.dataset.action==='new')addTab();if(b.dataset.action==='home')$('home').click();if(b.dataset.action==='settings')$('settings-button').click();if(b.dataset.action==='history')showToast(state.history.length+' history entries')});(async()=>{if(sessionStorage.getItem('vanillia-sw-reload')==='1')sessionStorage.removeItem('vanillia-sw-reload');if(state.engine!=='vanillia')await prepareProxyEngine(state.engine).catch(e=>devWrite('error',['Engine startup failed:',e],e.stack||''));document.querySelectorAll('.engine button').forEach(b=>b.classList.toggle('active',b.dataset.engine===state.engine));$('engine-select').value=state.engine;$('developer-mode').classList.toggle('on',state.developerMode);devtools.classList.toggle('visible',state.developerMode);$('workspace').classList.toggle('devtools-open',state.developerMode);state.tabs=[{title:'New Tab',url:''}];renderBookmarks();renderTabs();showTab()})();
