<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanillia</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --background:#111; --surface:#191919; --surface-hover:#222; --text:#f2f2f2; --text-secondary:#a6a6a6; --text-muted:#707070; --border:#303030; --accent:#dedede; --accent-hover:#fff; --danger:#d93025; --success:#188038; --radius:10px; --radius-small:7px; --shadow:0 2px 10px rgba(0,0,0,.18); }
      html, body { min-height:100%; background:var(--background); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
      body { min-height:100vh; }
      button,input,select { font:inherit; }
      button { color:inherit; }
      .header { width:100%; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--border); }
      .header-left,.header-right { display:flex; align-items:center; gap:12px; }
      .logo { font-size:20px; font-weight:600; letter-spacing:-.3px; }
      .button { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-small); background:var(--surface); color:var(--text); font-size:14px; font-weight:500; cursor:pointer; transition:background .15s ease,border-color .15s ease,transform .1s ease; }
      .button:hover { background:var(--surface-hover); border-color:#414141; }
      .button:active { transform:translateY(1px); }
      .button-primary { background:var(--accent); border-color:var(--accent); color:#111; }
      .button-primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
      .icon-button { width:40px; min-width:40px; padding:0; }
      .icon { width:18px; height:18px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .main { width:100%; max-width:1100px; margin:0 auto; padding:48px 24px; }
      .proxy-container { width:100%; max-width:800px; margin:0 auto; }
      .proxy-bar { display:flex; align-items:center; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:6px; box-shadow:var(--shadow); }
      .proxy-input { flex:1; min-width:0; height:46px; border:none; outline:none; padding:0 14px; background:transparent; color:var(--text); font-size:15px; }
      .proxy-input::placeholder { color:var(--text-muted); }
      .section { margin-top:32px; }
      .section:first-child { margin-top:0; }
      .section-title { font-size:16px; font-weight:600; margin-bottom:12px; }
      .section-description { color:var(--text-secondary); font-size:14px; margin-bottom:18px; }
      .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
      .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
      .card-title { font-size:16px; font-weight:600; margin-bottom:7px; }
      .card-description { color:var(--text-secondary); font-size:13px; line-height:1.5; }
      .backend-list { display:grid; gap:8px; }
      .backend { width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-small); background:var(--surface); cursor:pointer; text-align:left; }
      .backend:hover { background:var(--surface-hover); }
      .backend.active { border-color:#555; background:#202020; }
      .backend-name { font-size:14px; font-weight:500; }
      .backend-route { color:var(--text-muted); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
      .status { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--text-secondary); }
      .status-dot { width:8px; height:8px; border-radius:50%; background:var(--text-muted); }
      .status-online .status-dot { background:var(--success); }
      .status-error .status-dot { background:var(--danger); }
      .footer { width:100%; padding:24px; text-align:center; color:var(--text-muted); font-size:13px; border-top:1px solid var(--border); }
      @media (max-width:700px) { .header{padding:0 16px;} .main{padding:32px 16px;} .grid{grid-template-columns:1fr;} .proxy-bar{padding:5px;} .proxy-input{height:44px;} .backend-route{display:none;} }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-left"><div class="logo">Vanillia</div></div>
      <div class="header-right">
        <button class="button icon-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.42 1.42-.06-.06A1.7 1.7 0 0 0 16.44 18a1.7 1.7 0 0 0-1 .98 1.7 1.7 0 0 0-.12.64V20h-2.01v-.38A1.7 1.7 0 0 0 12.25 18a1.7 1.7 0 0 0-1.81.34l-.06.06-1.42-1.42.06-.06A1.7 1.7 0 0 0 9.36 15a1.7 1.7 0 0 0-.98-1A1.7 1.7 0 0 0 7.74 14H7.5v-2h.24a1.7 1.7 0 0 0 1.62-1.14 1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.42-1.42.06.06A1.7 1.7 0 0 0 12.25 6a1.7 1.7 0 0 0 1-.98 1.7 1.7 0 0 0 .12-.64V4h2.01v.38A1.7 1.7 0 0 0 16.44 6a1.7 1.7 0 0 0 1.81-.34l.06-.06 1.42 1.42-.06.06A1.7 1.7 0 0 0 19.36 9c.13.47.5.85.98 1 .2.06.41.09.62.09h.24v2h-.24a1.7 1.7 0 0 0-1.62 1.14 1.7 1.7 0 0 0 .06 1.77Z"></path></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="section proxy-container">
        <div class="proxy-bar">
          <input class="proxy-input" id="urlInput" type="text" inputmode="url" autocomplete="off" placeholder="Enter a URL...">
          <button class="button button-primary" id="goButton" type="button">Go</button>
        </div>
      </section>

      <section class="section proxy-container" id="backendSection">
        <div class="section-title">Backend</div>
        <div class="section-description">Choose the proxy runtime Vanillia should use.</div>
        <div class="backend-list" id="backendList">
          <button class="backend active" type="button" data-backend="vanilliapxy"><span><span class="backend-name">VanilliaPXY</span><br><span class="backend-route">/vanillia?url=</span></span></button>
          <button class="backend" type="button" data-backend="scramjet"><span><span class="backend-name">Scramjet</span><br><span class="backend-route">/education?portal=</span></span></button>
          <button class="backend" type="button" data-backend="ultraviolet"><span><span class="backend-name">Ultraviolet</span><br><span class="backend-route">/classroom?class=</span></span></button>
          <button class="backend" type="button" data-backend="rammerhead"><span><span class="backend-name">Rammerhead</span><br><span class="backend-route">/teach?learn=</span></span></button>
        </div>
      </section>

      <section class="section grid proxy-container">
        <div class="card"><div class="card-title">Selected backend</div><div class="card-description" id="selectedBackend">VanilliaPXY</div></div>
        <div class="card"><div class="card-title">Status</div><div class="status" id="status"><span class="status-dot"></span><span id="statusText">Ready</span></div></div>
      </section>
    </main>

    <footer class="footer">(c) 2026 Portal Network inc.</footer>

    <script>
      const BACKENDS = {
        vanilliapxy: { name: "VanilliaPXY", route: "/vanillia?url=" },
        scramjet: { name: "Scramjet", route: "/education?portal=" },
        ultraviolet: { name: "Ultraviolet", route: "/classroom?class=" },
        rammerhead: { name: "Rammerhead", route: "/teach?learn=" }
      };

      const urlInput = document.getElementById("urlInput");
      const goButton = document.getElementById("goButton");
      const backendList = document.getElementById("backendList");
      const selectedBackend = document.getElementById("selectedBackend");
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const settingsButton = document.getElementById("settingsButton");
      const backendSection = document.getElementById("backendSection");
      let selected = localStorage.getItem("vanillia-backend") || "vanilliapxy";
      if (!BACKENDS[selected]) selected = "vanilliapxy";

      function setStatus(text, state) {
        statusText.textContent = text;
        status.className = "status" + (state ? " status-" + state : "");
      }

      function selectBackend(key) {
        if (!BACKENDS[key]) return;
        selected = key;
        localStorage.setItem("vanillia-backend", key);
        selectedBackend.textContent = BACKENDS[key].name;
        document.querySelectorAll(".backend").forEach(button => button.classList.toggle("active", button.dataset.backend === key));
      }

      function normalizeUrl(value) {
        const input = value.trim();
        if (!input) return null;
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(input)) return input;
        if (/^[a-z][a-z0-9+.-]*:/i.test(input)) return input;
        return "https://" + input;
      }

      function launch() {
        const target = normalizeUrl(urlInput.value);
        if (!target) {
          setStatus("Enter a URL first", "error");
          urlInput.focus();
          return;
        }
        const backend = BACKENDS[selected];
        setStatus("Opening " + backend.name + "...", "online");
        window.location.href = backend.route + encodeURIComponent(target);
      }

      backendList.addEventListener("click", event => {
        const button = event.target.closest(".backend");
        if (!button) return;
        selectBackend(button.dataset.backend);
      });

      goButton.addEventListener("click", launch);
      urlInput.addEventListener("keydown", event => { if (event.key === "Enter") launch(); });
      settingsButton.addEventListener("click", () => backendSection.scrollIntoView({ behavior: "smooth", block: "center" }));
      selectBackend(selected);
    </script>
  </body>
</html>
