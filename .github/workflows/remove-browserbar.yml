name: Remove browser bar

on:
  push:
    paths:
      - .github/workflows/remove-browserbar.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove browser bar
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          content = path.read_text()
          old = '#browserbar { height: 42px; flex: 0 0 42px; display: flex;'
          new = '#browserbar { display: none; height: 0; flex: 0 0 0;'
          if old not in content:
              raise SystemExit("browserbar CSS not found")
          path.write_text(content.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Remove browser bar"
          git push
      - name: Remove workflow
        run: |
          rm .github/workflows/remove-browserbar.yml
          git add .github/workflows/remove-browserbar.yml
          git commit -m "Remove temporary browser bar workflow"
          git push
