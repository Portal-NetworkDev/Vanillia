name: Enable real proxy engines

on:
  push:
    paths:
      - .github/workflows/enable-real-engines.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'index.html';
          let content = fs.readFileSync(path, 'utf8');
          const old = `\tconst targetUrl = proxyUrl(target);\n\tif (openNewTab) {`;
          const replacement = `\tconst targetUrl = proxyUrl(target);\n\tif (selectedBackend === "scramjet" || selectedBackend === "ultraviolet") {\n\t\twindow.location.href = targetUrl;\n\t\treturn;\n\t}\n\tif (openNewTab) {`;
          if (!content.includes(old)) throw new Error('navigation marker not found');
          if (!content.includes('selectedBackend === "scramjet" || selectedBackend === "ultraviolet"')) {
            content = content.replace(old, replacement);
            fs.writeFileSync(path, content);
          }
          NODE
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Connect Scramjet and Ultraviolet backends"
          git push
      - name: Remove workflow
        run: |
          rm .github/workflows/enable-real-engines.yml
          git add .github/workflows/enable-real-engines.yml
          git commit -m "Remove temporary engine patch workflow"
          git push
