name: Fix proxy engine routes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''\tconst targetUrl = proxyUrl(target);\n\tif (selectedBackend === "scramjet" || selectedBackend === "ultraviolet") {\n\t\twindow.location.href = targetUrl;\n\t\treturn;\n\t}\n\tif (openNewTab) {'''
          new = '''\tconst targetUrl = proxyUrl(target);\n\tif (openNewTab) {'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Make engine routes use the page renderer backend
        run: |
          cat > api/scramjet.js <<'NODE'
          import { handleRequest } from "vanilliapxy";
          export default async function handler(req, res) {
            const originalUrl = req.url;
            const target = new URL(req.url, "https://vanillia.invalid").searchParams.get("portal");
            if (!target) { res.statusCode = 400; res.end("Missing portal target"); return; }
            req.url = "/vanillia?url=" + encodeURIComponent(target);
            try { await handleRequest(req, res); } finally { req.url = originalUrl; }
          }
          NODE
          cat > api/ultraviolet.js <<'NODE'
          import { handleRequest } from "vanilliapxy";
          export default async function handler(req, res) {
            const originalUrl = req.url;
            const target = new URL(req.url, "https://vanillia.invalid").searchParams.get("class");
            if (!target) { res.statusCode = 400; res.end("Missing class target"); return; }
            req.url = "/vanillia?url=" + encodeURIComponent(target);
            try { await handleRequest(req, res); } finally { req.url = originalUrl; }
          }
          NODE
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('vercel.json')
          c=json.loads(p.read_text())
          r=c.get('rewrites',[])
          for x in [
              {'source':'/education','destination':'/api/scramjet'},
              {'source':'/classroom','destination':'/api/ultraviolet'}
          ]:
              if x not in r: r.append(x)
          c['rewrites']=r
          p.write_text(json.dumps(c, indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot].users.noreply.github.com
          git add index.html api/scramjet.js api/ultraviolet.js vercel.json
          git diff --cached --quiet || git commit -m "Keep proxy engines inside Vanillia"
          git push
      - name: Remove workflow
        run: |
          rm .github/workflows/fix-engine-routes.yml
          git add .github/workflows/fix-engine-routes.yml
          git commit -m "Remove temporary engine route workflow"
          git push
