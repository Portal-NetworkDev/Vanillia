name: Vendor proxy engine assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install engine dependencies
        working-directory: engines
        run: npm install --no-package-lock --ignore-scripts
      - name: Vendor engine assets
        working-directory: engines
        run: npm run vendor
      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engines/public/baremux engines/public/scram engines/public/libcurl engines/public/epoxy engines/public/uv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Vendor proxy engine assets"
          git push
